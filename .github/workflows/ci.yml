name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install numpy scipy pytest QuantLib
      - name: Build
        run: make -j4
      - name: Tests (C, C++, interview, Python)
        run: make test PYTHON=python
      - name: AddressSanitizer + UBSan
        run: make sanitize
      - name: ThreadSanitizer
        run: make tsan
      - name: Mutation test
        run: python scripts/mutation_test.py
